<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FirstAmen Blog</title>
<meta name="description" content="Articles from the FirstAmen team about prayer, habits and mornings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14100F;--soft:#5E5A62;--pink:#C73F67;--gold:#8C6420;--nav:#F0F7FF;--card:#FDFEFF;--pale:#E8F1FD}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;color:var(--ink);background:linear-gradient(180deg,#B8DCF6 0%,#C9DFF6 20%,#D7E2F4 42%,#D9D6EE 70%,#F0D3E6 100%);min-height:100vh;position:relative;overflow-x:hidden}
a:focus-visible,button:focus-visible{outline:3px solid #7D5BE8;outline-offset:3px;border-radius:8px}
.skies{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;pointer-events:none;z-index:0}
.cl{position:absolute;background:rgba(255,255,255,.7);border-radius:99px;filter:blur(14px);pointer-events:none}
nav.site{background:var(--nav);display:flex;align-items:center;gap:26px;padding:14px 40px;font-size:15px;font-weight:500;position:relative;z-index:2;overflow-x:auto;white-space:nowrap}
.links{display:flex;flex:1;justify-content:space-between;align-items:center;gap:26px;min-width:max-content;margin-left:24px}
nav.site img{height:44px;margin-right:6px;display:block}
nav.site a{color:var(--ink);text-decoration:none;flex:none}
nav.site a:hover{color:var(--pink)}
nav.site a.on{color:var(--pink);font-weight:700}
.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--gold)}
.hl{color:var(--pink)}
.card{background:var(--card);border-radius:32px;box-shadow:0 20px 44px rgba(90,120,180,.20)}
.btn{display:inline-block;background:var(--ink);color:#fff;font:700 15px Poppins,system-ui,sans-serif;border-radius:99px;padding:13px 28px;text-decoration:none;border:0;cursor:pointer}
.btn2{display:inline-block;background:#fff;color:var(--ink);border:2px solid var(--ink);font-weight:700;font-size:15px;border-radius:99px;padding:11px 26px;text-decoration:none}
.meta{color:var(--soft);font-weight:500;font-size:15px}
.chip{display:inline-block;background:var(--ink);color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em;border-radius:99px;padding:3px 12px}
.back{display:inline-block;font-weight:700;color:var(--ink);text-decoration:none;background:#fff;border-radius:99px;padding:8px 20px;font-size:14px;box-shadow:0 8px 20px rgba(90,120,180,.18)}
.cols{max-width:1060px;margin:0 auto;padding:60px 32px 80px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:48px;position:relative;z-index:1}
.cols-article{grid-template-columns:260px minmax(0,1fr)}
.side{align-self:start;position:sticky;top:24px}
.side h1{font-size:50px;letter-spacing:-.035em;line-height:1.04;margin:10px 0 14px;font-weight:700}
.side p{color:var(--soft);font-size:17px;margin:0 0 24px}
.btns{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.entry{display:block;padding:26px 30px;margin-bottom:18px;text-decoration:none;color:var(--ink);transition:transform .15s}
.entry:hover{transform:translateY(-2px)}
.entry b{display:block;font-size:22px;letter-spacing:-.015em;line-height:1.22;margin:8px 0}
.more{margin-top:6px}
.notice{padding:28px 30px;color:var(--soft)}.notice b{color:var(--ink);font-size:20px}
.toc2{margin-top:20px;padding:22px 24px}
.toc2 h2{font-size:16px;margin:0 0 10px}
.toc2 a{display:block;color:var(--ink);text-decoration:none;font-size:14px;padding:7px 0;border-top:1px solid #DCE6F4;line-height:1.35}
.toc2 a:first-of-type{border-top:0}.toc2 a:hover{color:var(--pink)}
.artcol{padding:44px 48px 36px}
.artcol h1{font-size:46px;letter-spacing:-.03em;line-height:1.08;margin:10px 0 10px;font-weight:700}
.ameta{margin:0 0 26px}
.body h2{font-size:28px;margin:1.7em 0 .5em;letter-spacing:-.02em;line-height:1.2;font-weight:700}
.body h3{font-size:20px;margin:1.4em 0 .3em;font-weight:700}
.body h4{font-size:18px;margin:1.2em 0 .3em;font-weight:700}
.body p{margin:0 0 1.1em;font-size:18px;font-weight:400;color:#37323A}
.body ul,.body ol{margin:0 0 1.2em;padding-left:1.4em;font-size:18px;color:#37323A}.body li{margin-bottom:.4em}
.body>h2:first-child{margin-top:0}
.body ul{background:var(--pale);border-radius:24px;padding:20px 26px 20px 46px}
.body .toc ol{background:none;padding:0 0 0 1.2em;margin:0;font-size:16px}
.toc{border:2px solid #D3E2F6;border-radius:24px;padding:16px 26px;margin:0 0 1.6em}
.toc h2{font-size:17px;margin:0 0 6px}
.body a{color:var(--pink);font-weight:500}
.body blockquote{margin:1.6em 0;padding:22px 28px;background:linear-gradient(135deg,#D3E9FB,#F1DAEA);border-radius:24px;font-size:22px;font-weight:700;line-height:1.35}
.body code{background:#EEF2FA;border-radius:6px;padding:2px 6px;font-size:.92em}
.body pre{overflow-x:auto;background:#EEF2FA;border-radius:16px;padding:16px}
.body .tablewrap{overflow-x:auto;margin:0 0 1.2em}
.body table{border-collapse:collapse;width:100%;font-size:16px}
.body th,.body td{border-bottom:1px solid #DCE6F4;padding:10px 12px;text-align:left;vertical-align:top}
[dir=rtl] .body ul,[dir=rtl] .body ol{padding-left:0;padding-right:1.4em}
.toc2{display:block}.toc-inline{display:none}
@media (max-width:899px){
  nav.site{padding:12px 20px;gap:20px}
  .cols,.cols-article{grid-template-columns:minmax(0,1fr);gap:28px;padding:36px 20px 64px}
  .side{position:static}
  .side h1{font-size:40px}
  .toc2{display:none}.toc-inline{display:block}
  .artcol{padding:30px 24px 26px;border-radius:28px}
  .artcol h1{font-size:34px}
  .body p,.body ul,.body ol{font-size:17px}
}
@media (prefers-reduced-motion:reduce){.entry{transition:none}}
</style>
</head>

  // Plain GET, key as the only query parameter, no custom headers.
  function api(path, params, retried) {
    var q = 'key=' + encodeURIComponent(HEYCATCH_API_KEY);
    Object.keys(params || {}).forEach(function (k) { q += '&' + k + '=' + encodeURIComponent(params[k]); });
    var url = API + path + '?' + q;
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 15000) : null;
    return fetch(url, ctl ? { signal: ctl.signal } : undefined).then(function (res) {
      if (timer) clearTimeout(timer);
      if (res.status === 429 && !retried) {
        var wait = Math.min(parseInt(res.headers.get('Retry-After') || '2', 10) || 2, 30);
        return sleep(wait * 1000).then(function () { return api(path, params, true); });
      }
      if (!res.ok) { var e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
      return res.json();
    }, function (err) { if (timer) clearTimeout(timer); throw err; });
  }

  /* ---------- sanitiser (allow-list, runs before anything is inserted) ---------- */
  var ALLOWED = { H2:1,H3:1,H4:1,P:1,UL:1,OL:1,LI:1,TABLE:1,THEAD:1,TBODY:1,TFOOT:1,TR:1,TH:1,TD:1,
                  BLOCKQUOTE:1,A:1,STRONG:1,EM:1,CODE:1,PRE:1,BR:1,B:1,I:1,HR:1,SPAN:1 };
  var DROP = { SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,FORM:1,INPUT:1,BUTTON:1,TEXTAREA:1,SELECT:1,LINK:1,META:1,SVG:1,MATH:1,TEMPLATE:1 };
  function safeHref(h) {
    h = String(h || '').trim();
    if (h.charAt(0) === '#') return h;
    try {
      var u = new URL(h, 'https://repdbylove.com/');
      return (u.protocol === 'http:' || u.protocol === 'https:' || u.protocol === 'mailto:') ? h : null;
    } catch (e) { return null; }
  }
  function cleanNode(src, dst) {
    Array.prototype.forEach.call(src.childNodes, function (n) {
      if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue)); return; }
      if (n.nodeType !== 1) return;
      var tag = n.tagName;
      if (DROP[tag]) return;
      if (!ALLOWED[tag]) { cleanNode(n, dst); return; } // unknown tag: keep its text, lose the tag
      var el = document.createElement(tag);
      if (tag === 'A') {
        var h = safeHref(n.getAttribute('href'));
        if (h) {
          el.setAttribute('href', h);
          if (h.charAt(0) !== '#' && h.indexOf('mailto:') !== 0) { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener noreferrer'); }
        }
      }
      if (tag === 'H2' && n.getAttribute('id')) el.setAttribute('id', n.getAttribute('id')); // TOC targets
      if ((tag === 'TH' || tag === 'TD') && n.getAttribute('colspan')) el.setAttribute('colspan', String(parseInt(n.getAttribute('colspan'), 10) || 1));
      cleanNode(n, el);
      dst.appendChild(el);
    });
  }
  function sanitize(html) {
    var doc = new DOMParser().parseFromString('<body>' + String(html || '') + '</body>', 'text/html');
    var out = document.createElement('div');
    cleanNode(doc.body, out);
    Array.prototype.forEach.call(out.querySelectorAll('table'), function (t) { // scroll wide tables
      var w = document.createElement('div'); w.className = 'tablewrap';
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
    return out;
  }

  /* ---------- head tags ---------- */
  function setMeta(sel, attrs) {
    var el = document.head.querySelector(sel);
    if (!el) { el = document.createElement('meta'); document.head.appendChild(el); }
    Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
  }
  function setHead(title, desc, type) {
    document.title = title;
    setMeta('meta[name="description"]', { name: 'description', content: desc });
    setMeta('meta[property="og:title"]', { property: 'og:title', content: title });
    setMeta('meta[property="og:description"]', { property: 'og:description', content: desc });
    setMeta('meta[property="og:type"]', { property: 'og:type', content: type });
  }

  /* ---------- views ---------- */
  var PLAY = 'https://play.google.com/store/apps/details?id=com.rork.firstamen';
  var HOW = 'https://repdbylove.com/firstamen';
  function intro() {
    return '<aside class="side"><div class="eyebrow">Blog</div><h1>Prayer, habits and <span class="hl">mornings.</span></h1>' +
      '<p>Short reads from the FirstAmen team.</p><div class="btns"><a class="btn" href="' + PLAY + '">Get it on Google Play</a>' +
      '<a class="btn2" href="' + HOW + '">How it works</a></div></aside>';
  }
  function layout(side, main, cls) {
    app.className = 'cols ' + (cls || '');
    app.innerHTML = side + main;
  }
  function showEmpty(msg) {
    layout(intro(), '<section class="feed"><div class="card notice">' + esc(msg) + '</div></section>', 'cols-index');
  }
  function show404() {
    setHead('Article not found | FirstAmen Blog', 'This article could not be found.', 'website');
    layout('<aside class="side"><a class="back" href="#/">&larr; All articles</a></aside>',
      '<section class="feed"><div class="card notice"><b>Article not found</b><br>We could not find that article. It may have been moved or unpublished.</div></section>', 'cols-article');
  }

  function fetchAll() { // every article: keep going until offset reaches total
    var all = [];
    function page(offset) {
      return api('/articles', { limit: 50, offset: offset }).then(function (r) {
        var items = r.articles || [];
        all = all.concat(items);
        if (items.length && all.length < (r.total || 0)) return page(offset + 50);
        return all;
      });
    }
    return page(0);
  }

  function renderIndex() {
    setHead('FirstAmen Blog', 'Articles from the FirstAmen team about prayer, habits and mornings.', 'website');
    app.className='cols'; app.innerHTML = '<p class="meta" style="grid-column:1/-1">Loading&hellip;</p>';
    var p = memo.list ? Promise.resolve(memo.list) : fetchAll();
    p.then(function (items) { memo.list = items; paintIndex(items); }, function () {
      if (memo.list) paintIndex(memo.list); else showEmpty('No articles yet');
    });
  }
  var PAGE = 20;
  function paintIndex(items) {
    if (!items.length) { showEmpty('No articles yet'); return; }
    var shown = 0;
    layout(intro(), '<section class="feed" id="feed"></section>', 'cols-index');
    var feed = document.getElementById('feed');
    var btn = document.createElement('button');
    btn.className = 'btn more'; btn.type = 'button'; btn.textContent = 'Show more articles';
    function more() {
      items.slice(shown, shown + PAGE).forEach(function (a) {
        var el = document.createElement('a');
        el.className = 'card entry'; el.href = '#/' + encodeURIComponent(a.slug);
        el.innerHTML = (a.read_time ? '<span class="chip">' + esc(a.read_time) + ' MIN</span>' : '') +
          '<b>' + esc(a.title) + '</b><span class="meta">' + esc(fmtDate(a.published || a.published_at)) + '</span>';
        feed.insertBefore(el, btn.parentNode === feed ? btn : null);
      });
      shown = Math.min(items.length, shown + PAGE);
      if (shown >= items.length && btn.parentNode) btn.parentNode.removeChild(btn);
    }
    if (items.length > PAGE) feed.appendChild(btn);
    more();
    btn.addEventListener('click', more);
  }

  function renderArticle(slug) {
    app.className='cols'; app.innerHTML = '<p class="meta" style="grid-column:1/-1">Loading&hellip;</p>';
    var p = memo['a:' + slug] ? Promise.resolve(memo['a:' + slug]) :
      api('/articles/' + encodeURIComponent(slug)).then(function (r) { return r.article; });
    p.then(function (a) {
      if (!a) { show404(); return; }
      memo['a:' + slug] = a;
      paintArticle(a);
    }, function (err) {
      if (err && err.status === 404) show404();
      else if (memo['a:' + slug]) paintArticle(memo['a:' + slug]);
      else showEmpty('This article could not be loaded right now. Please try again in a few minutes.');
    });
  }
  function paintArticle(a) {
    setHead(a.title + ' | FirstAmen Blog', a.meta_description || '', 'article');
    var body = sanitize(a.content_html);
    var heads = Array.prototype.filter.call(body.querySelectorAll('h2'), function (h) { return h.id && h.id !== 'faq'; });
    var links = heads.map(function (h) {
      return '<a href="#' + esc(h.id) + '" data-jump="' + esc(h.id) + '">' + esc(h.textContent) + '</a>';
    });
    var sideToc = '';
    if (heads.length) {
      // inline table of contents, right after the Key takeaways list (shown on narrow screens)
      var toc = document.createElement('nav'); toc.className = 'toc toc-inline'; toc.setAttribute('aria-label', 'Table of contents');
      toc.innerHTML = '<h2>Table of contents</h2><ol>' + links.map(function (l) { return '<li>' + l + '</li>'; }).join('') + '</ol>';
      var kt = Array.prototype.filter.call(body.querySelectorAll('h2'), function (h) {
        return !h.id && /^\s*key takeaways\s*$/i.test(h.textContent);
      })[0];
      var anchor = null;
      if (kt) { var n = kt.nextElementSibling; if (n && (n.tagName === 'UL' || n.tagName === 'OL')) anchor = n; }
      if (anchor) anchor.parentNode.insertBefore(toc, anchor.nextSibling); else body.insertBefore(toc, body.firstChild);
      // the same links in the side column (shown on wide screens)
      sideToc = '<nav class="card toc2" aria-label="Table of contents"><h2>Table of contents</h2>' + links.join('') + '</nav>';
    }
    var lang = a.language && a.language !== SITE_LANG ? ' lang="' + esc(a.language) + '"' : '';
    var rtl = /^(ar|he|fa|ur)(-|$)/i.test(a.language || '') ? ' dir="rtl"' : '';
    layout('<aside class="side"><a class="back" href="#/">&larr; All articles</a>' + sideToc + '</aside>',
      '<article class="card artcol"' + lang + rtl + '><div class="eyebrow">From the blog</div><h1>' + esc(a.title) + '</h1>' +
      '<p class="meta ameta">' + meta(a) + '</p><div class="body" id="body"></div></article>', 'cols-article');
    document.getElementById('body').appendChild(body);
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[data-jump]') : null;
    if (!a) return;
    e.preventDefault();
    JUMP(a.getAttribute('data-jump'));
  });

  function route() {
    var h = decodeURIComponent((location.hash || '').replace(/^#\/?/, ''));
    var slug = h.replace(/^blog\//, '').replace(/\/$/, '');
    if (slug) renderArticle(slug); else renderIndex();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
